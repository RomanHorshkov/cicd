name: C quality

# The one quality gate for every kyr repository (workflow_call only), parameterised by inputs.
#
#   kind: lib   foundation-style library: utils/build_libs.sh (every profile inside), app/<lib-name>.c, and the optional
#               stages build_UTs_release.sh + build_UTs.sh, build_ITs.sh (+ run_ITs.sh, build_ITs_release.sh),
#               build_stress.sh + run_stress.sh, build_sanitizer_tests.sh, build_tsan_tests.sh; package
#               lib<lib-name>{,-dev}_<ver>_<arch>.deb + smoke_test_package.sh
#   kind: app   template-style repository: utils/build_libs.sh <profile> and/or build_bin.sh <profile>, build_tests.sh
#               <profile> (optional) + run_tests.sh <profile> per profile, run_ITs.sh (optional), run_fuzz_smoke.sh
#               <seconds> (optional); package: every build/debs/*.deb (+ smoke_test_package.sh when present)
#
# Every repository: deps.txt with the pinned kyr-build (bootstrapped here by exact version and sha256, no sudo, into
# build/sysroot), utils/deps.sh sysroot for every other pin, deps.sh check --tiers (the tier law), template_check.sh
# (no drift from the template), check_legacy_names.sh (no pre-kyr name; kyr-build 3.0.0 on, skipped before),
# utils/format.sh --check when present, utils/vendor.sh verify when present.
# A repository with abi/layout.txt: the ABI gate (utils/check_abi.sh, kyr-build share/abi) on the full history and tags,
# then the release library's exports (--exports); the package job waits for it.

on:
  workflow_call:
    inputs:
      kind:
        description: "lib or app (see the header)"
        required: true
        type: string
      lib-name:
        description: "kind lib: app/<lib-name>.c, packages lib<lib-name> and lib<lib-name>-dev"
        required: false
        type: string
        default: ""
      strict-cflags:
        description: "kind lib: flags for the gcc/clang strict compile of app/<lib-name>.c"
        required: false
        type: string
        default: "-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror"
      apt-packages:
        description: "apt packages installed in every job, on top of the apt lines of deps.txt"
        required: false
        type: string
        default: "pkg-config libcmocka-dev gcovr"
      profiles:
        description: "kind app: space separated build profiles"
        required: false
        type: string
        default: "debug audit sanitize release native extreme"
      profile-flag:
        description: "kind app: option name put before the profile, empty for a positional profile"
        required: false
        type: string
        default: ""
      fuzz-seconds:
        description: "kind app: bounded fuzz smoke pass length; 0 skips the job"
        required: false
        type: number
        default: 45
      tsan-runs-on:
        description: "kind lib: runner for the ThreadSanitizer job"
        required: false
        type: string
        default: "ubuntu-latest"
      stress-timeout-minutes:
        required: false
        type: number
        default: 30
    secrets:
      SIBLING_REPOS_PAT:
        description: "Token for private sibling releases read by utils/deps.sh (optional)"
        required: false

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  detect:
    name: Detect stages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      format: ${{ steps.s.outputs.format }}
      uts: ${{ steps.s.outputs.uts }}
      its: ${{ steps.s.outputs.its }}
      stress: ${{ steps.s.outputs.stress }}
      sanitizers: ${{ steps.s.outputs.sanitizers }}
      tsan: ${{ steps.s.outputs.tsan }}
      profiles: ${{ steps.s.outputs.profiles }}
      build-tests: ${{ steps.s.outputs.build_tests }}
      run-its: ${{ steps.s.outputs.run_its }}
      fuzz: ${{ steps.s.outputs.fuzz }}
      abi: ${{ steps.s.outputs.abi }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: s
        env:
          KIND: ${{ inputs.kind }}
          PROFILES: ${{ inputs.profiles }}
          FUZZ_SECONDS: ${{ inputs.fuzz-seconds }}
        run: |
          case "${KIND}" in lib|app) ;; *) echo "kind must be lib or app, got '${KIND}'" >&2; exit 1 ;; esac
          [ -f deps.txt ] || { echo "deps.txt is missing: every repository pins kyr-build" >&2; exit 1; }
          has() { [ -x "utils/$1" ] && echo true || echo false; }
          # shellcheck disable=SC2086
          json="$(printf '%s\n' ${PROFILES} | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')"
          {
            echo "format=$(has format.sh)"
            echo "uts=$(has build_UTs.sh)"
            echo "its=$(has build_ITs.sh)"
            echo "stress=$(has build_stress.sh)"
            echo "sanitizers=$(has build_sanitizer_tests.sh)"
            echo "tsan=$(has build_tsan_tests.sh)"
            echo "profiles=${json}"
            echo "build_tests=$(has build_tests.sh)"
            echo "run_its=$(has run_ITs.sh)"
            if [ "${FUZZ_SECONDS}" != "0" ] && [ -x utils/run_fuzz_smoke.sh ]; then echo "fuzz=true"; else echo "fuzz=false"; fi
            if [ -f abi/layout.txt ]; then echo "abi=true"; else echo "abi=false"; fi
          } >> "$GITHUB_OUTPUT"

  dependency-law:
    name: Dependency law and template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install apt packages
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get -yqq update
          # shellcheck disable=SC2046,SC2086
          sudo apt-get -yqq install build-essential fakeroot ${APT_PACKAGES} $(awk '$1=="apt"{print $2}' deps.txt)
      - name: Bootstrap kyr-build and resolve dependencies into the sysroot
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # kyr-build cannot pin itself through the file it ships: fetch the exact version deps.txt names, refuse any
          # other sha256, extract it into the sysroot without sudo; the repository's deps.sh then resolves the rest.
          read -r ver repo sha < <(awk '$1=="own" && $2=="kyr-build" {print $3, $4, $5}' deps.txt) || true
          [ -n "${ver}" ] || { echo "deps.txt pins no kyr-build" >&2; exit 1; }
          case "${sha}" in *[!0-9a-f]*|"") echo "the kyr-build pin carries no sha256" >&2; exit 1 ;; esac
          [ "${#sha}" -eq 64 ] || { echo "the kyr-build pin's sha256 is malformed" >&2; exit 1; }
          cache="${HOME}/.cache/rh-deps/debs"; mkdir -p "${cache}"
          gh release download "v${ver}" --repo "${repo}" --pattern "kyr-build_${ver}_all.deb" --dir "${cache}" --clobber
          echo "${sha}  ${cache}/kyr-build_${ver}_all.deb" | sha256sum --check --strict
          rm -rf build/kyr-build-bootstrap build/sysroot/share/kyr-build
          mkdir -p build/sysroot/share
          dpkg-deb -x "${cache}/kyr-build_${ver}_all.deb" build/kyr-build-bootstrap
          mv build/kyr-build-bootstrap/usr/local/share/kyr-build build/sysroot/share/kyr-build
          ./utils/deps.sh sysroot
          if [ -x utils/vendor.sh ]; then ./utils/vendor.sh verify; fi
          ./utils/deps.sh env --plain >> "$GITHUB_ENV"
      - name: Tier law
        run: ./utils/deps.sh check --tiers
      - name: Template drift
        run: build/sysroot/share/kyr-build/template_check.sh "$PWD"
      - name: Legacy names
        run: |
          # kyr-build 3.0.0 and later ship the gate (check_legacy_names.sh, legacy_names.allow at the root); an older pin has none
          gate=build/sysroot/share/kyr-build/check_legacy_names.sh
          if [ -x "${gate}" ]; then "${gate}" "$PWD"; else echo "skipped: the pinned kyr-build predates 3.0.0"; fi

  abi-gate:
    name: ABI gate (SemVer against the last release tag) and exports
    needs: detect
    if: needs.detect.outputs.abi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0   # the version rule reads every commit that changed abi/layout.txt and the newest v<x.y.z> tag
          fetch-tags: true
      - name: Install apt packages
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get -yqq update
          # shellcheck disable=SC2046,SC2086
          sudo apt-get -yqq install build-essential fakeroot python3 binutils ${APT_PACKAGES} $(awk '$1=="apt"{print $2}' deps.txt)
      - name: Bootstrap kyr-build and resolve dependencies into the sysroot
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # kyr-build cannot pin itself through the file it ships: fetch the exact version deps.txt names, refuse any
          # other sha256, extract it into the sysroot without sudo; the repository's deps.sh then resolves the rest.
          read -r ver repo sha < <(awk '$1=="own" && $2=="kyr-build" {print $3, $4, $5}' deps.txt) || true
          [ -n "${ver}" ] || { echo "deps.txt pins no kyr-build" >&2; exit 1; }
          case "${sha}" in *[!0-9a-f]*|"") echo "the kyr-build pin carries no sha256" >&2; exit 1 ;; esac
          [ "${#sha}" -eq 64 ] || { echo "the kyr-build pin's sha256 is malformed" >&2; exit 1; }
          cache="${HOME}/.cache/rh-deps/debs"; mkdir -p "${cache}"
          gh release download "v${ver}" --repo "${repo}" --pattern "kyr-build_${ver}_all.deb" --dir "${cache}" --clobber
          echo "${sha}  ${cache}/kyr-build_${ver}_all.deb" | sha256sum --check --strict
          rm -rf build/kyr-build-bootstrap build/sysroot/share/kyr-build
          mkdir -p build/sysroot/share
          dpkg-deb -x "${cache}/kyr-build_${ver}_all.deb" build/kyr-build-bootstrap
          mv build/kyr-build-bootstrap/usr/local/share/kyr-build build/sysroot/share/kyr-build
          ./utils/deps.sh sysroot
          if [ -x utils/vendor.sh ]; then ./utils/vendor.sh verify; fi
          ./utils/deps.sh env --plain >> "$GITHUB_ENV"
      - name: The public ABI against abi/layout.txt and the version rule
        run: ./utils/check_abi.sh
      - name: Build the release library
        env:
          KIND: ${{ inputs.kind }}
          PROFILE_FLAG: ${{ inputs.profile-flag }}
        run: |
          # shellcheck disable=SC2086
          if [ "${KIND}" = lib ]; then ./utils/build_libs.sh release; else ./utils/build_libs.sh ${PROFILE_FLAG} release; fi
      - name: Exports, exactly the declared functions under <NODE>_<major>
        run: ./utils/check_abi.sh --exports

  format-check:
    name: clang-format check
    needs: detect
    if: needs.detect.outputs.format == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq install clang-format-18
      - run: CLANG_FORMAT=clang-format-18 ./utils/format.sh --check

  build:
    name: Build (all profiles)
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install apt packages
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get -yqq update
          # shellcheck disable=SC2046,SC2086
          sudo apt-get -yqq install build-essential fakeroot ${APT_PACKAGES} $(awk '$1=="apt"{print $2}' deps.txt)
      - name: Bootstrap kyr-build and resolve dependencies into the sysroot
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # kyr-build cannot pin itself through the file it ships: fetch the exact version deps.txt names, refuse any
          # other sha256, extract it into the sysroot without sudo; the repository's deps.sh then resolves the rest.
          read -r ver repo sha < <(awk '$1=="own" && $2=="kyr-build" {print $3, $4, $5}' deps.txt) || true
          [ -n "${ver}" ] || { echo "deps.txt pins no kyr-build" >&2; exit 1; }
          case "${sha}" in *[!0-9a-f]*|"") echo "the kyr-build pin carries no sha256" >&2; exit 1 ;; esac
          [ "${#sha}" -eq 64 ] || { echo "the kyr-build pin's sha256 is malformed" >&2; exit 1; }
          cache="${HOME}/.cache/rh-deps/debs"; mkdir -p "${cache}"
          gh release download "v${ver}" --repo "${repo}" --pattern "kyr-build_${ver}_all.deb" --dir "${cache}" --clobber
          echo "${sha}  ${cache}/kyr-build_${ver}_all.deb" | sha256sum --check --strict
          rm -rf build/kyr-build-bootstrap build/sysroot/share/kyr-build
          mkdir -p build/sysroot/share
          dpkg-deb -x "${cache}/kyr-build_${ver}_all.deb" build/kyr-build-bootstrap
          mv build/kyr-build-bootstrap/usr/local/share/kyr-build build/sysroot/share/kyr-build
          ./utils/deps.sh sysroot
          if [ -x utils/vendor.sh ]; then ./utils/vendor.sh verify; fi
          ./utils/deps.sh env --plain >> "$GITHUB_ENV"
      - if: inputs.kind == 'lib'
        run: ./utils/build_libs.sh
      - if: inputs.kind == 'app'
        env:
          PROFILES: ${{ inputs.profiles }}
          PROFILE_FLAG: ${{ inputs.profile-flag }}
        run: |
          for profile in ${PROFILES}; do
            # shellcheck disable=SC2086
            if [ -x utils/build_libs.sh ]; then ./utils/build_libs.sh ${PROFILE_FLAG} "${profile}"; fi
            # shellcheck disable=SC2086
            if [ -x utils/build_bin.sh ]; then ./utils/build_bin.sh ${PROFILE_FLAG} "${profile}"; fi
          done

  compiler-portability:
    name: Strict compile (${{ matrix.compiler }})
    needs: build
    if: inputs.kind == 'lib'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq install build-essential clang
      - env:
          CC_BIN: ${{ matrix.compiler }}
          LIB: ${{ inputs.lib-name }}
          STRICT_CFLAGS: ${{ inputs.strict-cflags }}
        run: |
          # shellcheck disable=SC2086
          "${CC_BIN}" ${STRICT_CFLAGS} -Iapp -c "app/${LIB}.c" -o "/tmp/${LIB}-${CC_BIN}.o"

  unit-tests-coverage:
    name: Unit tests + coverage
    needs: [detect, build]
    if: inputs.kind == 'lib' && needs.detect.outputs.uts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install apt packages
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get -yqq update
          # shellcheck disable=SC2046,SC2086
          sudo apt-get -yqq install build-essential fakeroot ${APT_PACKAGES} $(awk '$1=="apt"{print $2}' deps.txt)
      - name: Bootstrap kyr-build and resolve dependencies into the sysroot
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # kyr-build cannot pin itself through the file it ships: fetch the exact version deps.txt names, refuse any
          # other sha256, extract it into the sysroot without sudo; the repository's deps.sh then resolves the rest.
          read -r ver repo sha < <(awk '$1=="own" && $2=="kyr-build" {print $3, $4, $5}' deps.txt) || true
          [ -n "${ver}" ] || { echo "deps.txt pins no kyr-build" >&2; exit 1; }
          case "${sha}" in *[!0-9a-f]*|"") echo "the kyr-build pin carries no sha256" >&2; exit 1 ;; esac
          [ "${#sha}" -eq 64 ] || { echo "the kyr-build pin's sha256 is malformed" >&2; exit 1; }
          cache="${HOME}/.cache/rh-deps/debs"; mkdir -p "${cache}"
          gh release download "v${ver}" --repo "${repo}" --pattern "kyr-build_${ver}_all.deb" --dir "${cache}" --clobber
          echo "${sha}  ${cache}/kyr-build_${ver}_all.deb" | sha256sum --check --strict
          rm -rf build/kyr-build-bootstrap build/sysroot/share/kyr-build
          mkdir -p build/sysroot/share
          dpkg-deb -x "${cache}/kyr-build_${ver}_all.deb" build/kyr-build-bootstrap
          mv build/kyr-build-bootstrap/usr/local/share/kyr-build build/sysroot/share/kyr-build
          ./utils/deps.sh sysroot
          if [ -x utils/vendor.sh ]; then ./utils/vendor.sh verify; fi
          ./utils/deps.sh env --plain >> "$GITHUB_ENV"
      - run: ./utils/build_UTs_release.sh
      - run: ./utils/build_UTs.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uts-coverage
          if-no-files-found: warn
          path: tests/results/*UTs*

  test:
    name: Tests (${{ matrix.profile }})
    needs: [detect, build]
    if: inputs.kind == 'app'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.detect.outputs.profiles) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install apt packages
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get -yqq update
          # shellcheck disable=SC2046,SC2086
          sudo apt-get -yqq install build-essential fakeroot ${APT_PACKAGES} $(awk '$1=="apt"{print $2}' deps.txt)
      - name: Bootstrap kyr-build and resolve dependencies into the sysroot
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # kyr-build cannot pin itself through the file it ships: fetch the exact version deps.txt names, refuse any
          # other sha256, extract it into the sysroot without sudo; the repository's deps.sh then resolves the rest.
          read -r ver repo sha < <(awk '$1=="own" && $2=="kyr-build" {print $3, $4, $5}' deps.txt) || true
          [ -n "${ver}" ] || { echo "deps.txt pins no kyr-build" >&2; exit 1; }
          case "${sha}" in *[!0-9a-f]*|"") echo "the kyr-build pin carries no sha256" >&2; exit 1 ;; esac
          [ "${#sha}" -eq 64 ] || { echo "the kyr-build pin's sha256 is malformed" >&2; exit 1; }
          cache="${HOME}/.cache/rh-deps/debs"; mkdir -p "${cache}"
          gh release download "v${ver}" --repo "${repo}" --pattern "kyr-build_${ver}_all.deb" --dir "${cache}" --clobber
          echo "${sha}  ${cache}/kyr-build_${ver}_all.deb" | sha256sum --check --strict
          rm -rf build/kyr-build-bootstrap build/sysroot/share/kyr-build
          mkdir -p build/sysroot/share
          dpkg-deb -x "${cache}/kyr-build_${ver}_all.deb" build/kyr-build-bootstrap
          mv build/kyr-build-bootstrap/usr/local/share/kyr-build build/sysroot/share/kyr-build
          ./utils/deps.sh sysroot
          if [ -x utils/vendor.sh ]; then ./utils/vendor.sh verify; fi
          ./utils/deps.sh env --plain >> "$GITHUB_ENV"
      - env:
          PROFILE: ${{ matrix.profile }}
          PROFILE_FLAG: ${{ inputs.profile-flag }}
          BUILD_TESTS: ${{ needs.detect.outputs.build-tests }}
        run: |
          # shellcheck disable=SC2086
          if [ -x utils/build_libs.sh ]; then ./utils/build_libs.sh ${PROFILE_FLAG} "${PROFILE}"; fi
          # shellcheck disable=SC2086
          if [ "${BUILD_TESTS}" = "true" ]; then ./utils/build_tests.sh ${PROFILE_FLAG} "${PROFILE}"; fi
          # shellcheck disable=SC2086
          ./utils/run_tests.sh ${PROFILE_FLAG} "${PROFILE}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-${{ matrix.profile }}
          if-no-files-found: ignore
          path: build/${{ matrix.profile }}/tests/**

  integration:
    name: Integration tests
    needs: [detect, build]
    if: (inputs.kind == 'lib' && needs.detect.outputs.its == 'true') || (inputs.kind == 'app' && needs.detect.outputs.run-its == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install apt packages
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get -yqq update
          # shellcheck disable=SC2046,SC2086
          sudo apt-get -yqq install build-essential fakeroot ${APT_PACKAGES} $(awk '$1=="apt"{print $2}' deps.txt)
      - name: Bootstrap kyr-build and resolve dependencies into the sysroot
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # kyr-build cannot pin itself through the file it ships: fetch the exact version deps.txt names, refuse any
          # other sha256, extract it into the sysroot without sudo; the repository's deps.sh then resolves the rest.
          read -r ver repo sha < <(awk '$1=="own" && $2=="kyr-build" {print $3, $4, $5}' deps.txt) || true
          [ -n "${ver}" ] || { echo "deps.txt pins no kyr-build" >&2; exit 1; }
          case "${sha}" in *[!0-9a-f]*|"") echo "the kyr-build pin carries no sha256" >&2; exit 1 ;; esac
          [ "${#sha}" -eq 64 ] || { echo "the kyr-build pin's sha256 is malformed" >&2; exit 1; }
          cache="${HOME}/.cache/rh-deps/debs"; mkdir -p "${cache}"
          gh release download "v${ver}" --repo "${repo}" --pattern "kyr-build_${ver}_all.deb" --dir "${cache}" --clobber
          echo "${sha}  ${cache}/kyr-build_${ver}_all.deb" | sha256sum --check --strict
          rm -rf build/kyr-build-bootstrap build/sysroot/share/kyr-build
          mkdir -p build/sysroot/share
          dpkg-deb -x "${cache}/kyr-build_${ver}_all.deb" build/kyr-build-bootstrap
          mv build/kyr-build-bootstrap/usr/local/share/kyr-build build/sysroot/share/kyr-build
          ./utils/deps.sh sysroot
          if [ -x utils/vendor.sh ]; then ./utils/vendor.sh verify; fi
          ./utils/deps.sh env --plain >> "$GITHUB_ENV"
      - if: inputs.kind == 'lib'
        run: |
          ./utils/build_libs.sh
          ./utils/build_ITs.sh
          if [ -x utils/run_ITs.sh ]; then ./utils/run_ITs.sh; fi
          if [ -x utils/build_ITs_release.sh ]; then ./utils/build_ITs_release.sh; fi
      - if: inputs.kind == 'app'
        run: |
          if [ -x utils/build_libs.sh ]; then ./utils/build_libs.sh release; fi
          ./utils/run_ITs.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-results
          if-no-files-found: ignore
          path: tests/results

  stress:
    name: Stress tests
    needs: [detect, build]
    if: inputs.kind == 'lib' && needs.detect.outputs.stress == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.stress-timeout-minutes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install apt packages
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get -yqq update
          # shellcheck disable=SC2046,SC2086
          sudo apt-get -yqq install build-essential fakeroot ${APT_PACKAGES} $(awk '$1=="apt"{print $2}' deps.txt)
      - name: Bootstrap kyr-build and resolve dependencies into the sysroot
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # kyr-build cannot pin itself through the file it ships: fetch the exact version deps.txt names, refuse any
          # other sha256, extract it into the sysroot without sudo; the repository's deps.sh then resolves the rest.
          read -r ver repo sha < <(awk '$1=="own" && $2=="kyr-build" {print $3, $4, $5}' deps.txt) || true
          [ -n "${ver}" ] || { echo "deps.txt pins no kyr-build" >&2; exit 1; }
          case "${sha}" in *[!0-9a-f]*|"") echo "the kyr-build pin carries no sha256" >&2; exit 1 ;; esac
          [ "${#sha}" -eq 64 ] || { echo "the kyr-build pin's sha256 is malformed" >&2; exit 1; }
          cache="${HOME}/.cache/rh-deps/debs"; mkdir -p "${cache}"
          gh release download "v${ver}" --repo "${repo}" --pattern "kyr-build_${ver}_all.deb" --dir "${cache}" --clobber
          echo "${sha}  ${cache}/kyr-build_${ver}_all.deb" | sha256sum --check --strict
          rm -rf build/kyr-build-bootstrap build/sysroot/share/kyr-build
          mkdir -p build/sysroot/share
          dpkg-deb -x "${cache}/kyr-build_${ver}_all.deb" build/kyr-build-bootstrap
          mv build/kyr-build-bootstrap/usr/local/share/kyr-build build/sysroot/share/kyr-build
          ./utils/deps.sh sysroot
          if [ -x utils/vendor.sh ]; then ./utils/vendor.sh verify; fi
          ./utils/deps.sh env --plain >> "$GITHUB_ENV"
      - run: ./utils/build_stress.sh
      - run: ./utils/run_stress.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stress-results
          if-no-files-found: ignore
          path: tests/results/stress

