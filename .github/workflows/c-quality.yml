  package-smoke:
    name: Package build + install + smoke test
    needs: [dependency-law, abi-gate, build, format-check, compiler-portability, unit-tests-coverage, test, integration, stress, sanitizers, thread-sanitizer, fuzz-smoke]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0   # the debs are dated by the last commit that touched a build input (kyr-build lib/epoch.sh)
      - name: Install apt packages
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get -yqq update
          # shellcheck disable=SC2046,SC2086
          sudo apt-get -yqq install build-essential fakeroot ${APT_PACKAGES} $(awk '$1=="apt"{print $2}' deps.txt)
      - name: Bootstrap kyr-build and resolve dependencies into the sysroot
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # kyr-build cannot pin itself through the file it ships: fetch the exact version deps.txt names, refuse any
          # other sha256, extract it into the sysroot without sudo; the repository's deps.sh then resolves the rest.
          read -r ver repo sha < <(awk '$1=="own" && $2=="kyr-build" {print $3, $4, $5}' deps.txt) || true
          [ -n "${ver}" ] || { echo "deps.txt pins no kyr-build" >&2; exit 1; }
          case "${sha}" in *[!0-9a-f]*|"") echo "the kyr-build pin carries no sha256" >&2; exit 1 ;; esac
          [ "${#sha}" -eq 64 ] || { echo "the kyr-build pin's sha256 is malformed" >&2; exit 1; }
          cache="${HOME}/.cache/rh-deps/debs"; mkdir -p "${cache}"
          gh release download "v${ver}" --repo "${repo}" --pattern "kyr-build_${ver}_all.deb" --dir "${cache}" --clobber
          echo "${sha}  ${cache}/kyr-build_${ver}_all.deb" | sha256sum --check --strict
          rm -rf build/kyr-build-bootstrap build/sysroot/share/kyr-build
          mkdir -p build/sysroot/share
          dpkg-deb -x "${cache}/kyr-build_${ver}_all.deb" build/kyr-build-bootstrap
          mv build/kyr-build-bootstrap/usr/local/share/kyr-build build/sysroot/share/kyr-build
          ./utils/deps.sh sysroot
          if [ -x utils/vendor.sh ]; then ./utils/vendor.sh verify; fi
          ./utils/deps.sh env --plain >> "$GITHUB_ENV"
      - run: ./utils/build_deb.sh
      - if: inputs.kind == 'lib'
        env:
          LIB: ${{ inputs.lib-name }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ARCH="$(dpkg --print-architecture)"
          for f in "build/debs/lib${LIB}_${VERSION}_${ARCH}.deb" "build/debs/lib${LIB}-dev_${VERSION}_${ARCH}.deb"; do
            [ -f "${f}" ] || { echo "expected package not found: ${f}" >&2; exit 1; }
          done
      - name: Install the packages (the runner is the VM lane; the build itself never touched /usr/local)
        run: |
          ls build/debs/*.deb >/dev/null || { echo "no .deb under build/debs" >&2; exit 1; }
          # First the pinned own debs from the cache deps.sh filled (runtime Depends), then ours.
          if ls "${HOME}"/.cache/rh-deps/debs/*.deb >/dev/null 2>&1; then sudo apt-get -yqq install "${HOME}"/.cache/rh-deps/debs/*.deb; fi
          sudo apt-get -yqq install ./build/debs/*.deb
      - if: hashFiles('utils/smoke_test_package.sh') != ''
        run: ./utils/smoke_test_package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-package
          if-no-files-found: error
          path: |
            build/debs/*.deb
            build/debs/*.buildinfo
            build/debs/SHA256SUMS
