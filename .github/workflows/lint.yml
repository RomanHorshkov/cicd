name: Lint workflows

# zizmor: security audit of the workflows. actionlint: schema, expressions, shellcheck.
# Both installed at a pinned version through checksum-verifying package managers.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install zizmor (pinned)
        run: pipx install zizmor==1.30.1
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # online audits: pin validity, impostor commits
        run: zizmor --min-severity low --min-confidence medium --persona regular .github/workflows

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksummed by the Go module proxy)
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color
